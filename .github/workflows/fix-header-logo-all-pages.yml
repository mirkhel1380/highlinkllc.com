name: Fix header logo on all pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Highlink logo to every header brand
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          brand_re=re.compile(r'(<a\b[^>]*\bclass=["\'][^"\']*\bbrand\b[^"\']*["\'][^>]*>)(.*?)(</a>)', re.I|re.S)

          for p in sorted(Path('.').glob('*.html')):
              s=p.read_text(encoding='utf-8', errors='ignore')
              old=s
              def repl(m):
                  start,inner,end=m.groups()
                  # Only touch the Highlink site brand, not unrelated brand-named anchors.
                  plain=re.sub(r'<[^>]+>','',inner)
                  if 'High' not in plain or 'LLC' not in plain:
                      return m.group(0)
                  if re.search(r'<img\b[^>]*>', inner, re.I):
                      inner=re.sub(r'(<img\b[^>]*\bsrc=["\'])/?highlink-logo\.png(["\'])', r'\1/highlink-logo.png\2', inner, flags=re.I)
                  else:
                      inner='<img src="/highlink-logo.png" alt="Highlink LLC logo">'+inner
                  return start+inner+end
              s=brand_re.sub(repl,s)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.name)

          cssp=Path('mobile-nav.css')
          css=cssp.read_text(encoding='utf-8') if cssp.exists() else ''
          rule='.brand img{width:40px;height:40px;object-fit:contain;border-radius:10px;margin-right:10px;flex:0 0 auto;display:block}'
          if rule not in css:
              css=rule+'\n'+css
              cssp.write_text(css,encoding='utf-8')
              changed.append('mobile-nav.css')

          missing=[]
          total=0
          for p in sorted(Path('.').glob('*.html')):
              s=p.read_text(encoding='utf-8', errors='ignore')
              for m in brand_re.finditer(s):
                  inner=m.group(2)
                  plain=re.sub(r'<[^>]+>','',inner)
                  if 'High' in plain and 'LLC' in plain:
                      total+=1
                      if '/highlink-logo.png' not in inner:
                          missing.append(p.name)

          print('BRAND_ANCHORS=', total)
          print('UPDATED_COUNT=', len(changed))
          print('UPDATED=', ','.join(changed))
          print('MISSING_LOGO_COUNT=', len(missing))
          print('MISSING=', ','.join(missing))
          PY
      - name: Commit header logo fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html mobile-nav.css
          if git diff --cached --quiet; then
            echo "No header logo changes needed"
          else
            git commit -m "Show Highlink logo across all page headers"
            git push
          fi
