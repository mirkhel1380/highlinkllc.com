name: Deep affiliate link audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all affiliate links without visiting tracking URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import socket

          expected_affiliate = {
            'Inc Authority':'https://goto.incauthority.com/OeX9Mn',
            'LLC Attorney':'https://companysage.pxf.io/OYn25n',
            'Airwallex':'https://airwallex.sjv.io/3kyDYn',
            'Namecheap':'https://namecheap.pxf.io/qWmb0g',
            'Domain.com':'https://domain.mno8.net/4ayQ23',
            'Your Company Formation':'https://www.awin1.com/cread.php?awinmid=27700&awinaffid=1840866',
            'Rapid Formations':'https://rapid-formations.sjv.io/GKaY4n',
            'InterServer':'https://www.dpbolvw.net/click-101587884-11145908',
            'FlashCloud':'https://flashcloud.pxf.io/NGROX1',
            'Shopify':'https://shopify.pxf.io/LKZRoO',
            'SITE123':'https://site123ltd.sjv.io/R01vYb',
            'Bluehost':'https://bluehost.sjv.io/xJy4mv',
            'InMotion Hosting':'https://partners.inmotionhosting.com/ZVX9mk',
            'Kamatera':'https://kamatera.sjv.io/zzyL06',
            'OpenArt':'https://openartai.pxf.io/xJr4my',
            'Genspark':'https://mainfuncpteltd.sjv.io/7XnjD5',
            'Manychat':'https://manychat.pxf.io/rEG6b3',
            'Sider':'https://vidlineinc.pxf.io/L0nbrM',
            'NordVPN':'https://nordvpn.sjv.io/OeexAQ',
            'Surfshark':'https://surfshark.sjv.io/4aJQRo',
            'Webroot':'https://stasupteltd.sjv.io/YV1Q4j',
            'SentryPC':'https://sentrypc.7eer.net/aOOnxq',
            'Registered Agents Inc. (RAINC)':'https://www.awin1.com/cread.php?awinmid=81169&awinaffid=2460965',
          }
          direct_allowed = {
            'Talkpal':'https://talkpal.ai/',
            'Moz':'https://moz.com/',
          }
          affiliate_urls=set(expected_affiliate.values())
          all_expected=affiliate_urls | set(direct_allowed.values())

          class P(HTMLParser):
            def __init__(self):
              super().__init__(); self.links=[]; self.current=None; self.text=[]
            def handle_starttag(self, tag, attrs):
              if tag.lower()=='a':
                d=dict(attrs); self.current=d; self.text=[]
            def handle_data(self, data):
              if self.current is not None: self.text.append(data)
            def handle_endtag(self, tag):
              if tag.lower()=='a' and self.current is not None:
                self.links.append((self.current, ' '.join(''.join(self.text).split())))
                self.current=None; self.text=[]

          occurrences=[]
          for p in sorted(Path('.').glob('*.html')):
            parser=P(); parser.feed(p.read_text(encoding='utf-8', errors='ignore'))
            for attrs,text in parser.links:
              href=attrs.get('href','')
              if href.startswith('http://') or href.startswith('https://'):
                host=urlparse(href).netloc.lower()
                if host.endswith('highlinkllc.com'): continue
                occurrences.append((p.name,href,attrs.get('target',''),attrs.get('rel',''),text))

          print('TOTAL_EXTERNAL_OCCURRENCES=',len(occurrences))
          print('UNIQUE_EXTERNAL_URLS=',len(set(x[1] for x in occurrences)))
          print('EXPECTED_AFFILIATE_URLS=',len(affiliate_urls))

          issues=[]
          present=set(x[1] for x in occurrences)
          for brand,url in expected_affiliate.items():
            if url not in present:
              issues.append(f'MISSING_EXPECTED\t{brand}\t{url}')
          for brand,url in direct_allowed.items():
            if url not in present:
              print(f'NOTE_DIRECT_NOT_PRESENT\t{brand}\t{url}')

          # Validate each occurrence.
          for page,url,target,rel,text in occurrences:
            kind='AFFILIATE' if url in affiliate_urls else ('DIRECT_ALLOWED' if url in direct_allowed.values() else 'UNRECOGNIZED')
            status=[]
            if kind=='AFFILIATE':
              rel_tokens=set(rel.split())
              needed={'nofollow','sponsored','noopener'}
              if target!='_blank': status.append('target_not_blank')
              miss=needed-rel_tokens
              if miss: status.append('missing_rel:'+','.join(sorted(miss)))
              if '\\' in url: status.append('backslash_in_url')
              if ' ' in url: status.append('space_in_url')
            if kind=='UNRECOGNIZED': status.append('external_url_not_in_expected_map')
            print('LINK\t'+ '\t'.join([kind,page,text or '(no text)',url,'target='+target,'rel='+rel, 'STATUS=' + ('OK' if not status else '|'.join(status))]))
            if status: issues.append('\t'.join([kind,page,url,'|'.join(status)]))

          # DNS only: verifies tracking hostnames exist, without requesting/clicking affiliate paths.
          hosts=sorted(set(urlparse(u).netloc.lower() for u in present))
          for host in hosts:
            try:
              socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
              print(f'DNS_OK\t{host}')
            except Exception as e:
              issues.append(f'DNS_FAIL\t{host}\t{type(e).__name__}')
              print(f'DNS_FAIL\t{host}\t{type(e).__name__}')

          unexpected=sorted(present-all_expected)
          print('UNRECOGNIZED_URL_COUNT=',len(unexpected))
          for u in unexpected: print('UNRECOGNIZED_URL\t'+u)
          print('ISSUE_COUNT=',len(issues))
          for i in issues: print('ISSUE\t'+i)
          PY
