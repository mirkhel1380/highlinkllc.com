name: Add mobile navigation across site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mobile-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject mobile navigation assets
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          css='<link rel="stylesheet" href="/mobile-nav.css">'
          js='<script src="/mobile-nav.js" defer></script>'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              if css not in s and '</head>' in s:
                  s=s.replace('</head>',css+'</head>',1)
              if js not in s and '</body>' in s:
                  s=s.replace('</body>',js+'</body>',1)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Enable mobile navigation across site"
            git push
          fi
