name: Apply Highlink brand name and persistent theme to all pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebrand every HTML page without modifying outbound links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          script = '<script>(function(){try{document.documentElement.setAttribute("data-hl-theme",localStorage.getItem("hl-theme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-hl-theme","light")}})();</script>'
          changed=[]
          total=0
          outbound_total=0
          for p in sorted(Path('.').glob('*.html')):
              s = p.read_text(encoding='utf-8')
              old = s
              old_external = sorted(re.findall(r'href=["\x27](https?://[^"\x27]+)',old))
              s = re.sub(r'\bHighlink[ \t]+LLC\b', 'Highlink', s, flags=re.I)
              s = re.sub(r'(High\s*<span\b[^>]*>\s*link\s*</span>)\s*LLC\b',r'\1',s,flags=re.I)
              s = re.sub(r'(High\s*<em\b[^>]*>\s*link\s*</em>)\s*LLC\b',r'\1',s,flags=re.I)
              if 'data-hl-theme' not in s:
                  s,n = re.subn(r'(<head\b[^>]*>)',lambda m:m.group(1)+'\n'+script+'\n',s,count=1,flags=re.I)
                  if n!=1:raise ValueError('Missing head: '+p.name)
              if sorted(re.findall(r'href=["\x27](https?://[^"\x27]+)',s))!=old_external:
                  raise ValueError('External URL changed: '+p.name)
              if 'mobile-nav.js' not in s or 'mobile-nav.css' not in s:
                  raise ValueError('Missing shared styles or scripts in '+p.name)
              if re.search(r'Highlink[ \t]+LLC\b',s,re.I):
                  raise ValueError('Old display name remains in '+p.name)
              if s.count(script)!=1:
                  raise ValueError('Theme bootstrap missing/duplicated: '+p.name)
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.name)
              total+=1
              outbound_total+=len(old_external)
          seo=Path('.github/workflows/seo-foundation.yml').read_text(encoding='utf-8')
          if 'Highlink LLC' in seo:raise ValueError('SEO workflow would restore old brand')
          js=Path('mobile-nav.js').read_text(encoding='utf-8')
          if 'Highlink LLC' in js:raise ValueError('Navigation script has old brand')
          if 'hl-theme-button' not in js or 'hl-subnav' not in js:raise ValueError('Theme or secondary nav missing')
          css=Path('mobile-nav.css').read_text(encoding='utf-8')
          if 'data-hl-theme="dark"' not in css:raise ValueError('Dark style missing')
          print('PAGES=',total,'UPDATED=',len(changed),'EXTERNAL_LINKS_PRESERVED=',outbound_total)
          print('FILES=',', '.join(changed))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No further changes"
          else
            git commit -m "Apply Highlink branding and theme preference to all 39 pages"
            git push
          fi
