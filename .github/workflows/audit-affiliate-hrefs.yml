name: Audit affiliate hrefs
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List external links without opening them
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlparse

          seen=[]
          for p in sorted(Path('.').glob('*.html')):
              s=p.read_text(encoding='utf-8', errors='ignore')
              for m in re.finditer(r'href=["\'](https?://[^"\']+)["\']', s, re.I):
                  url=m.group(1).replace('&amp;','&')
                  host=urlparse(url).netloc.lower()
                  if host.endswith('highlinkllc.com'):
                      continue
                  item=(p.name,url)
                  if item not in seen:
                      seen.append(item)
          print(f'TOTAL_EXTERNAL_LINKS={len(seen)}')
          for page,url in seen:
              print(f'{page}\t{url}')
          PY
