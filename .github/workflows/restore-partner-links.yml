name: Restore partner tracking links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore tracking URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mapping = {
            'https://www.incauthority.com/': 'https://goto.incauthority.com/OeX9Mn',
            'https://www.llcattorney.com/': 'https://companysage.pxf.io/OYn25n',
            'https://www.airwallex.com/': 'https://airwallex.sjv.io/3kyDYn',
            'https://www.namecheap.com/': 'https://namecheap.pxf.io/qWmb0g',
            'https://www.domain.com/': 'https://domain.mno8.net/4ayQ23',
            'https://www.yourcompanyformations.co.uk/': 'https://www.awin1.com/cread.php?awinmid=27700&awinaffid=1840866',
            'https://www.rapidformations.co.uk/': 'https://rapid-formations.sjv.io/GKaY4n',
            'https://www.interserver.net/': 'https://www.dpbolvw.net/click-101587884-11145908',
            'https://flashcloud.com/': 'https://flashcloud.pxf.io/NGROX1',
            'https://www.shopify.com/': 'https://shopify.pxf.io/LKZRoO',
            'https://www.site123.com/': 'https://site123ltd.sjv.io/R01vYb',
            'https://www.bluehost.com/': 'https://bluehost.sjv.io/xJy4mv',
            'https://www.inmotionhosting.com/': 'https://partners.inmotionhosting.com/ZVX9mk',
            'https://www.kamatera.com/': 'https://kamatera.sjv.io/zzyL06',
            'https://openart.ai/': 'https://openartai.pxf.io/xJr4my',
            'https://www.genspark.ai/': 'https://mainfuncpteltd.sjv.io/7XnjD5',
            'https://manychat.com/': 'https://manychat.pxf.io/rEG6b3',
            'https://sider.ai/': 'https://vidlineinc.pxf.io/L0nbrM',
            'https://nordvpn.com/': 'https://nordvpn.sjv.io/OeexAQ',
            'https://surfshark.com/': 'https://surfshark.sjv.io/4aJQRo',
            'https://www.webroot.com/': 'https://stasupteltd.sjv.io/YV1Q4j',
            'https://www.webroot.com/us/en': 'https://stasupteltd.sjv.io/YV1Q4j',
            'https://www.sentrypc.com/': 'https://sentrypc.7eer.net/aOOnxq',
          }

          for path in Path('.').glob('*.html'):
            text = path.read_text(encoding='utf-8')
            original = text
            for direct, tracking in mapping.items():
              text = text.replace(f'href="{direct}"', f'href="{tracking}"')
              text = text.replace(
                f'href="{tracking}" target="_blank" rel="noopener"',
                f'href="{tracking}" target="_blank" rel="nofollow sponsored noopener"'
              )
            if text != original:
              path.write_text(text, encoding='utf-8')

          # Remove this temporary workflow so it only runs once.
          Path('.github/workflows/restore-partner-links.yml').unlink(missing_ok=True)
          PY

      - name: Commit restored links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Restore partner tracking links"
            git push
          fi