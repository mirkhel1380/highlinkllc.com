name: One-time site cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean site content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'https://goto.incauthority.com/OeX9Mn': 'https://www.incauthority.com/',
              'https://companysage.pxf.io/OYn25n': 'https://www.llcattorney.com/',
              'https://airwallex.sjv.io/3kyDYn': 'https://www.airwallex.com/',
              'https://namecheap.pxf.io/qWmb0g': 'https://www.namecheap.com/',
              'https://domain.mno8.net/4ayQ23': 'https://www.domain.com/',
              'https://www.awin1.com/cread.php?awinmid=27700&awinaffid=1840866': 'https://www.yourcompanyformations.co.uk/',
              'https://rapid-formations.sjv.io/GKaY4n': 'https://www.rapidformations.co.uk/',
              'https://www.dpbolvw.net/click-101587884-11145908': 'https://www.interserver.net/',
              'https://flashcloud.pxf.io/NGROX1': 'https://flashcloud.com/',
              'https://shopify.pxf.io/LKZRoO': 'https://www.shopify.com/',
              'https://site123ltd.sjv.io/R01vYb': 'https://www.site123.com/',
              'https://bluehost.sjv.io/xJy4mv': 'https://www.bluehost.com/',
              'https://partners.inmotionhosting.com/ZVX9mk': 'https://www.inmotionhosting.com/',
              'https://kamatera.sjv.io/zzyL06': 'https://www.kamatera.com/',
              'https://openartai.pxf.io/xJr4my': 'https://openart.ai/',
              'https://mainfuncpteltd.sjv.io/7XnjD5': 'https://www.genspark.ai/',
              'https://manychat.pxf.io/rEG6b3': 'https://manychat.com/',
              'https://vidlineinc.pxf.io/L0nbrM': 'https://sider.ai/',
              'https://nordvpn.sjv.io/OeexAQ': 'https://nordvpn.com/',
              'https://surfshark.sjv.io/4aJQRo': 'https://surfshark.com/',
              'https://stasupteltd.sjv.io/YV1Q4j': 'https://www.webroot.com/',
              'https://sentrypc.7eer.net/aOOnxq': 'https://www.sentrypc.com/',
          }

          affiliate_phrases = [
              'This page contains affiliate links.',
              'This page contains an affiliate link.',
              'Some links on this page are affiliate links.',
              'Some links are affiliate links.',
              'Highlink LLC may earn a commission from qualifying purchases.',
              'Highlink LLC may earn a commission if you make a qualifying purchase, at no additional cost to you.',
              'Highlink LLC may earn a commission from qualifying purchases at no additional cost to you.',
          ]

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              old = text

              for src, dst in replacements.items():
                  text = text.replace(src, dst)

              text = text.replace('rel="nofollow sponsored noopener"', 'rel="noopener"')
              text = text.replace("rel='nofollow sponsored noopener'", "rel='noopener'")

              # Remove links to the disclosure page anywhere on the site.
              text = re.sub(r'\s*<a\b[^>]*href=["\']affiliate-disclosure\.html["\'][^>]*>.*?</a>\s*', ' ', text, flags=re.I|re.S)

              # Remove common disclosure blocks and lines.
              text = re.sub(r'<div\b[^>]*class=["\'][^"\']*note[^"\']*["\'][^>]*>\s*<strong>\s*Affiliate disclosure:\s*</strong>.*?</div>', '', text, flags=re.I|re.S)
              text = re.sub(r'<p\b[^>]*class=["\'][^"\']*disclosure[^"\']*["\'][^>]*>.*?</p>', '', text, flags=re.I|re.S)
              text = re.sub(r'<p\b[^>]*>\s*(?:This page contains|Some links(?: on this page)? are)[^<]*affiliate[^<]*</p>', '', text, flags=re.I|re.S)

              for phrase in affiliate_phrases:
                  text = text.replace(phrase, '')

              text = text.replace('Affiliate Disclosure', '')
              text = re.sub(r'\s*\|\s*\|\s*', ' | ', text)
              text = re.sub(r'\s*·\s*·\s*', ' · ', text)

              if text != old:
                  path.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8')
              text = re.sub(r'\s*<url>\s*<loc>https://highlinkllc\.com/affiliate-disclosure\.html</loc>\s*</url>\s*', '\n', text, flags=re.I)
              sitemap.write_text(text, encoding='utf-8')

          disclosure = Path('affiliate-disclosure.html')
          if disclosure.exists():
              disclosure.unlink()

          workflow = Path('.github/workflows/site-cleanup.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove affiliate references and tracking links site-wide"
          git push
