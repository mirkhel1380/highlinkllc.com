name: One-time Highlink design quality check
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check mobile-nav.js
      - name: Check pages, navigation and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys
          pages=list(Path('.').glob('*.html'))
          errors=[]
          internal=0
          for p in pages:
              html=p.read_text(encoding='utf-8')
              for required in ('mobile-nav.css','mobile-nav.js','highlink-favicon.png','rel="canonical"'):
                  if required not in html:errors.append(f'{p}: missing {required}')
              if p.name in ('index.html','business-registration.html','website-hosting.html','ai-seo.html','vpn-security.html'):
                  if html.count('<main')!=1 or html.count('</main>')!=1:errors.append(f'{p}: main structure invalid')
              for href in re.findall(r'href=["\x27]([^"\x27]+)',html):
                  if href.startswith(('http:','https:','mailto:','javascript:','#','tel:','data:')):continue
                  target=href.split('#')[0].split('?')[0].lstrip('/')
                  if not target:continue
                  if not Path(target).exists():errors.append(f'{p}: missing local link {href}')
                  internal+=1
          source=Path('mobile-nav.js').read_text(encoding='utf-8')
          if 'hl-header' not in source or 'hl-footer' not in source:errors.append('shared navigation missing')
          css=Path('mobile-nav.css').read_text(encoding='utf-8')
          if '.hl-cover' not in css or '.hl-menu' not in css:errors.append('new visual system missing')
          seo=Path('seo-tools.html').read_text(encoding='utf-8')
          for url in ('https://moz.pxf.io/rE3eWR','https://moz.pxf.io/c/5899362/3249091/26520'):
              if url not in seo:errors.append('Moz affiliate link missing: '+url)
          print('HTML_PAGES',len(pages),'INTERNAL_LINKS_CHECKED',internal,'ERRORS',len(errors))
          for e in errors:print('ERROR',e)
          if errors:sys.exit(1)
          PY
